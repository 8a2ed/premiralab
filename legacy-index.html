        description: "تصميم أكياس وعلب القهوة مع إبراز طابع الأناقة والاستدامة."
      }
    ];

    const DEFAULT_TESTIMONIALS = [
      { id: "t-1", name: "م. طارق العتيبي", role: "الرئيس التنفيذي - شركة نماء", rating: 5, text: "العمل مع الاستوديو كان تجربة استثنائية. الالتزام بالوقت مع جودة تنفيذ إبداعية تتجاوز التوقعات.", avatar: "https://i.pravatar.cc/150?img=11" },
      { id: "t-2", name: "سارة محمود", role: "مديرة التسويق - براند ريفان", rating: 5, text: "التصاميم جذبت عملاءنا بشكل مباشر وزادت نسبة التفاعل. الاهتمام بالتفاصيل متقن جدًا.", avatar: "https://i.pravatar.cc/150?img=5" },
      { id: "t-3", name: "د. خالد السعيد", role: "مؤسس منصة تعلم", rating: 5, text: "خبرة الـ 20 عامًا واضحة تمامًا في فهم المتطلبات وسرعة التحليل والبدء الفوري. شكرًا جزيلًا!", avatar: "https://i.pravatar.cc/150?img=12" }
    ];

    const DEFAULT_ORDERS = [
      { id: "ORD-901", clientName: "أحمد مصطفى", clientPhone: "01098765432", contactPreference: "واتساب", itemTitle: "باقة انطلاقة الهوية البصرية", price: 12500, status: "قيد التنفيذ", date: "2026-03-28", notes: "الرجاء التركيز على ألوان الأزرق والذهبي." }
    ];

    function App() {
      // Data Persistence
      const [settings, setSettings] = useState(() => JSON.parse(localStorage.getItem('ds_settings_v3')) || DEFAULT_SETTINGS);
      const [packages, setPackages] = useState(() => JSON.parse(localStorage.getItem('ds_packages_v3')) || DEFAULT_PACKAGES);
      const [services, setServices] = useState(() => JSON.parse(localStorage.getItem('ds_services_v3')) || DEFAULT_SERVICES);
      const [portfolio, setPortfolio] = useState(() => JSON.parse(localStorage.getItem('ds_portfolio_v3')) || DEFAULT_PORTFOLIO);
      const [testimonials, setTestimonials] = useState(() => JSON.parse(localStorage.getItem('ds_testimonials_v3')) || DEFAULT_TESTIMONIALS);
      const [orders, setOrders] = useState(() => JSON.parse(localStorage.getItem('ds_orders_v3')) || DEFAULT_ORDERS);

      // Views & Auth State
      const [view, setView] = useState('client'); // 'client' or 'admin'
      const [showSecureAuthModal, setShowSecureAuthModal] = useState(false);
      const [authStep, setAuthStep] = useState(1); // 1: Username & Password, 2: PIN Verification
      
      // Security Form State
      const [inputUser, setInputUser] = useState('');
      const [inputPass, setInputPass] = useState('');
      const [inputPin, setInputPin] = useState('');
      const [authError, setAuthError] = useState('');
      const [failedAttempts, setFailedAttempts] = useState(0);
      const [isLockedOut, setIsLockedOut] = useState(false);
      const [lockoutTimer, setLockoutTimer] = useState(0);

      // Hidden Access Triggers
      const [logoClickCount, setLogoClickCount] = useState(0);

      // Client Modals
      const [selectedItemForOrder, setSelectedItemForOrder] = useState(null);
      const [showOrderModal, setShowOrderModal] = useState(false);
      const [activePortfolioModal, setActivePortfolioModal] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);

      // Save to localStorage
      useEffect(() => { localStorage.setItem('ds_settings_v3', JSON.stringify(settings)); }, [settings]);
      useEffect(() => { localStorage.setItem('ds_packages_v3', JSON.stringify(packages)); }, [packages]);
      useEffect(() => { localStorage.setItem('ds_services_v3', JSON.stringify(services)); }, [services]);
      useEffect(() => { localStorage.setItem('ds_portfolio_v3', JSON.stringify(portfolio)); }, [portfolio]);
      useEffect(() => { localStorage.setItem('ds_testimonials_v3', JSON.stringify(testimonials)); }, [testimonials]);
      useEffect(() => { localStorage.setItem('ds_orders_v3', JSON.stringify(orders)); }, [orders]);

      // Lockout Timer Handler
      useEffect(() => {
        let timer;
        if (isLockedOut && lockoutTimer > 0) {
          timer = setInterval(() => {
            setLockoutTimer((prev) => {
              if (prev <= 1) {
                setIsLockedOut(false);
                setFailedAttempts(0);
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [isLockedOut, lockoutTimer]);

      // Keyboard Shortcut Listener for Hidden Admin Entrance (Ctrl + Shift + A or Cmd + Shift + A)
      useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'A' || e.key === 'a' || e.key === 'ش')) {
            e.preventDefault();
            triggerSecretAuthEntrance();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [view]);

      const triggerToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      const triggerSecretAuthEntrance = () => {
        if (view === 'admin') {
          setView('client');
          triggerToast("تم العودة لواجهة الزائر");
        } else {
          setShowSecureAuthModal(true);
          setAuthStep(1);
          setAuthError('');
        }
      };

      // Handle Hidden Click Trigger on Logo (5 Clicks)
      const handleLogoClick = () => {
        const newCount = logoClickCount + 1;
        setLogoClickCount(newCount);
        if (newCount >= 5) {
          setLogoClickCount(0);
          triggerSecretAuthEntrance();
        }
        setTimeout(() => setLogoClickCount(0), 2000);
      };

      // Auth Handlers
      const handleStep1Submit = (e) => {
        e.preventDefault();
        if (isLockedOut) return;

        if (inputUser === settings.adminUsername && inputPass === settings.adminPassword) {
          setAuthStep(2);
          setAuthError('');
        } else {
          handleAuthFailure("اسم المستخدم أو كلمة المرور غير صحيحة!");
        }
      };

      const handleStep2Submit = (e) => {
        e.preventDefault();
        if (isLockedOut) return;

        if (inputPin === settings.adminPin) {
          setView('admin');
          setShowSecureAuthModal(false);
          setInputUser('');
          setInputPass('');
          setInputPin('');
          setAuthStep(1);
          setAuthError('');
          setFailedAttempts(0);
          triggerToast("تم المصادقة بنجاح! مرحبًا بك في لوحة التحكم الفائقة");
        } else {
          handleAuthFailure("رمز PIN غير صحيح!");
        }
      };

      const handleAuthFailure = (errorMsg) => {
        const attempts = failedAttempts + 1;
        setFailedAttempts(attempts);
        if (attempts >= 3) {
          setIsLockedOut(true);
          setLockoutTimer(300); // 5 minutes lock
          setAuthError("تم حظر الوصول المؤقت بسبب المحاولات الخاطئة المتكررة! حاول بعد 5 دقائق.");
        } else {
          setAuthError(`${errorMsg} (المحاولة ${attempts} من 3)`);
        }
      };

      const handleOpenOrder = (item) => {
        setSelectedItemForOrder(item);
        setShowOrderModal(true);
      };

      const handleCreateOrder = (orderData) => {
        const newOrd = {
          id: `ORD-${Math.floor(1000 + Math.random() * 9000)}`,
          ...orderData,
          status: 'قيد الانتظار',
          date: new Date().toISOString().split('T')[0]
        };
        setOrders([newOrd, ...orders]);
        setShowOrderModal(false);
        triggerToast("تم تقديم طلبك بنجاح! سنتواصل معك في أقرب وقت.");
      };

      const handleImageUpload = (file, callback) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onloadend = () => callback(reader.result);
        reader.readAsDataURL(file);
      };

      return (
        <div className="min-h-screen bg-dark-bg text-gray-100 flex flex-col font-sans">
          
          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-brand text-white px-6 py-3.5 rounded-2xl shadow-glow-brand text-xs font-extrabold flex items-center space-x-2 space-x-reverse animate-bounce border border-white/20">
              <i className="fa-solid fa-circle-check text-sm"></i>
              <span>{toastMessage}</span>
            </div>
          )}

          {/* Navigation Bar */}
          <header className="sticky top-0 z-40 glass-effect border-b border-dark-border">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
              
              {/* Brand Logo with Hidden 5-Click Trigger & Custom Logo Support */}
              <div 
                onClick={handleLogoClick}
                className="flex items-center space-x-3 space-x-reverse cursor-pointer group"
                title="استوديو الابتكار (انقر 5 مرات للدخول السري)"
              >
                {settings.logoImage ? (
                  <img 
                    src={settings.logoImage} 
                    alt={settings.siteName} 
                    className="w-10 h-10 object-contain rounded-xl border border-brand/30 bg-dark-card p-0.5 shadow-glow-brand-sm group-hover:scale-105 transition-transform" 
                  />
                ) : (
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand to-brand-light flex items-center justify-center text-white font-black text-xl shadow-glow-brand group-hover:scale-105 transition-transform">
                    <i className="fa-solid fa-pen-nib"></i>
                  </div>
                )}
                <div>
                  <h1 className="font-extrabold text-lg tracking-tight text-white group-hover:text-brand transition-colors">{settings.siteName}</h1>
                  <span className="text-[11px] text-gray-400 font-medium block">{settings.logoSubtitle}</span>
                </div>
              </div>

              {/* Nav Links */}
              {view === 'client' && (
                <nav className="hidden md:flex items-center space-x-8 space-x-reverse text-xs font-bold text-gray-300">
                  <a href="#packages" className="hover:text-brand transition-colors">الباقات</a>
                  <a href="#services" className="hover:text-brand transition-colors">الخدمات الفردية</a>
                  <a href="#portfolio" className="hover:text-brand transition-colors">معرض الأعمال</a>
                  <a href="#testimonials" className="hover:text-brand transition-colors">آراء العملاء</a>
                </nav>
              )}

              {/* Action Buttons */}
              <div className="flex items-center space-x-3 space-x-reverse">
                {view === 'admin' ? (
                  <button 
                    onClick={() => setView('client')} 
                    className="bg-brand/20 hover:bg-brand text-brand hover:text-white px-4 py-2 rounded-xl text-xs font-bold border border-brand/40 transition-all flex items-center space-x-2 space-x-reverse shadow-glow-brand-sm"
                  >
                    <i className="fa-solid fa-globe"></i>
                    <span>معاينة موقع العميل</span>
                  </button>
                ) : (
                  <a 
                    href="#packages" 
                    className="bg-brand hover:bg-brand-dark text-white px-5 py-2.5 rounded-xl text-xs font-bold shadow-glow-brand transition-all flex items-center space-x-2 space-x-reverse"
                  >
                    <i className="fa-solid fa-rocket"></i>
                    <span>اطلب خدمتك الآن</span>
                  </a>
                )}
              </div>
            </div>
          </header>

          {/* MAIN CONTENT */}
          <main className="flex-grow">
            {view === 'client' ? (
              <ClientView 
                settings={settings}
                packages={packages}
                services={services}
                portfolio={portfolio}
                testimonials={testimonials}
                onSelectOrder={handleOpenOrder}
                onOpenPortfolioModal={setActivePortfolioModal}
              />
            ) : (
              <AdminDashboard 
                settings={settings} setSettings={setSettings}

                    </div>
                    <p className="text-xs text-gray-300 italic">"{t.text}"</p>
                    <div className="flex items-center space-x-2 space-x-reverse pt-2 border-t border-dark-border">
                      <button onClick={() => setEditingTestimonial(t)} className="flex-1 bg-dark-bg text-xs font-bold py-2 rounded-xl border border-dark-border">تعديل</button>
                      <button onClick={() => { setTestimonials(testimonials.filter(item => item.id !== t.id)); triggerToast("تم الحذف"); }} className="bg-red-500/10 text-red-400 text-xs font-bold px-3 py-2 rounded-xl">حذف</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* TAB 7: SECURITY & CREDENTIALS */}
          {tab === 'security' && (
            <div className="bg-dark-card border border-brand/40 rounded-3xl p-6 max-w-xl mx-auto space-y-6 shadow-glow-brand-sm">
              <div className="text-center">
                <div className="w-12 h-12 bg-brand/20 text-brand rounded-2xl flex items-center justify-center mx-auto mb-2 text-xl">
                  <i className="fa-solid fa-lock"></i>
                </div>
                <h3 className="text-lg font-black text-white">تعديل معايير الأمان وكلمات المرور السرية</h3>
                <p className="text-xs text-gray-400 mt-1">احرص على حفظ بياناتك الجديدة جيدًا لمنع فقدان الوصول للوحة التحكم</p>
              </div>

              <div className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-gray-300 mb-1">اسم المستخدم البرمجي (Username)</label>
                  <input 
                    type="text" 
                    value={settings.adminUsername} 
                    onChange={(e) => setSettings({ ...settings, adminUsername: e.target.value })}
                    className="w-full bg-dark-bg border border-dark-border rounded-xl px-4 py-2.5 text-xs text-white focus:border-brand"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-gray-300 mb-1">كلمة المرور المشفرة (Password)</label>
                  <input 
                    type="text" 
                    value={settings.adminPassword} 
                    onChange={(e) => setSettings({ ...settings, adminPassword: e.target.value })}
                    className="w-full bg-dark-bg border border-dark-border rounded-xl px-4 py-2.5 text-xs text-white focus:border-brand"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-brand mb-1">رمز PIN السري (6 أرقام)</label>
                  <input 
                    type="text" 
                    maxLength={6}
                    value={settings.adminPin} 
                    onChange={(e) => setSettings({ ...settings, adminPin: e.target.value })}
                    className="w-full bg-dark-bg border border-brand/50 rounded-xl px-4 py-2.5 text-xs text-white font-mono tracking-widest text-center focus:border-brand"
                  />
                </div>

                <div className="p-3 bg-amber-500/10 border border-amber-500/30 rounded-xl text-[11px] text-amber-300">
                  <i className="fa-solid fa-lightbulb ml-1"></i>
                  طريقة الدخول السرية السريعة: اضغط على الكيبورد <strong>Ctrl + Shift + A</strong> أو قم بالنقر 5 مرات متتالية على اللوجو في أعلى الصفحة.
                </div>

                <button 
                  onClick={() => triggerToast("تم تحديث بيانات الأمان بنجاح")}
                  className="w-full bg-brand hover:bg-brand-dark text-white font-bold py-3 rounded-xl text-xs shadow-glow-brand transition-all"
                >
                  تحديث واعتماد بيانات الأمان
                </button>
              </div>
            </div>
          )}

          {/* PACKAGE EDIT MODAL */}
          {editingPackage && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 overflow-y-auto">
              <div className="bg-dark-card border border-dark-border rounded-3xl p-6 w-full max-w-lg space-y-4 my-8">
                <h3 className="text-base font-extrabold text-white">إضافة / تعديل باقة</h3>
                <form onSubmit={savePackage} className="space-y-3">
                  <input type="text" placeholder="اسم الباقة" required value={editingPackage.title} onChange={e => setEditingPackage({ ...editingPackage, title: e.target.value })} className="w-full bg-dark-bg border border-dark-border rounded-xl p-3 text-xs text-white" />
                  <input type="text" placeholder="الشعار الفرعي" value={editingPackage.tagline} onChange={e => setEditingPackage({ ...editingPackage, tagline: e.target.value })} className="w-full bg-dark-bg border border-dark-border rounded-xl p-3 text-xs text-white" />
                  <div className="grid grid-cols-2 gap-3">
                    <input type="number" placeholder="السعر (ج.م)" required value={editingPackage.price} onChange={e => setEditingPackage({ ...editingPackage, price: Number(e.target.value) })} className="w-full bg-dark-bg border border-dark-border rounded-xl p-3 text-xs text-white" />
                    <input type="text" placeholder="مدة التنفيذ" value={editingPackage.turnaround} onChange={e => setEditingPackage({ ...editingPackage, turnaround: e.target.value })} className="w-full bg-dark-bg border border-dark-border rounded-xl p-3 text-xs text-white" />
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold text-gray-300 mb-1">صورة الباقة (رابط أو رفع من الجهاز)</label>
                    <input type="text" placeholder="رابط الصورة" value={editingPackage.previewImage} onChange={e => setEditingPackage({ ...editingPackage, previewImage: e.target.value })} className="w-full bg-dark-bg border border-dark-border rounded-xl p-3 text-xs text-white mb-2" />
                    <input type="file" accept="image/*" onChange={(e) => handleImageUpload(e.target.files[0], (base64) => setEditingPackage({ ...editingPackage, previewImage: base64 }))} className="text-xs text-gray-400" />
                  </div>

                  <div>
                    <label className="block text-[11px] text-gray-300 mb-1">المميزات (مفصولة بفاصلة)</label>
                    <input type="text" value={editingPackage.features?.join(', ') || ''} onChange={e => setEditingPackage({ ...editingPackage, features: e.target.value.split(',').map(s => s.trim()) })} className="w-full bg-dark-bg border border-dark-border rounded-xl p-3 text-xs text-white" />
                  </div>

                  <div className="flex items-center space-x-2 space-x-reverse pt-2">
                    <button type="submit" className="flex-1 bg-brand text-white font-bold py-2.5 rounded-xl text-xs">حفظ الباقة</button>
                    <button type="button" onClick={() => setEditingPackage(null)} className="bg-gray-800 text-gray-300 py-2.5 px-4 rounded-xl text-xs">إلغاء</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* SERVICE EDIT MODAL */}
          {editingService && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="bg-dark-card border border-dark-border rounded-3xl p-6 w-full max-w-md space-y-4">
                <h3 className="text-base font-extrabold text-white">إضافة / تعديل خدمة فردية</h3>
                <form onSubmit={saveService} className="space-y-3">
                  <input type="text" placeholder="عنوان الخدمة" required value={editingService.title} onChange={e => setEditingService({ ...editingService, title: e.target.value })} className="w-full bg-dark-bg border border-dark-border rounded-xl p-3 text-xs text-white" />
                  <input type="text" placeholder="التصنيف" value={editingService.category} onChange={e => setEditingService({ ...editingService, category: e.target.value })} className="w-full bg-dark-bg border border-dark-border rounded-xl p-3 text-xs text-white" />
                  <input type="number" placeholder="السعر (ج.م)" required value={editingService.price} onChange={e => setEditingService({ ...editingService, price: Number(e.target.value) })} className="w-full bg-dark-bg border border-dark-border rounded-xl p-3 text-xs text-white" />
                  <textarea placeholder="وصف الخدمة" value={editingService.desc} onChange={e => setEditingService({ ...editingService, desc: e.target.value })} className="w-full bg-dark-bg border border-dark-border rounded-xl p-3 text-xs text-white" rows={3}></textarea>
                  <div className="flex items-center space-x-2 space-x-reverse pt-2">
                    <button type="submit" className="flex-1 bg-brand text-white font-bold py-2.5 rounded-xl text-xs">حفظ الخدمة</button>
                    <button type="button" onClick={() => setEditingService(null)} className="bg-gray-800 text-gray-300 py-2.5 px-4 rounded-xl text-xs">إلغاء</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* PORTFOLIO EDIT MODAL */}
          {editingPortfolio && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 overflow-y-auto">
              <div className="bg-dark-card border border-dark-border rounded-3xl p-6 w-full max-w-md space-y-4 my-8">
                <h3 className="text-base font-extrabold text-white">إضافة / تعديل مشروع المعرض</h3>
                <form onSubmit={savePortfolio} className="space-y-3">
                  <input type="text" placeholder="عنوان المشروع" required value={editingPortfolio.title} onChange={e => setEditingPortfolio({ ...editingPortfolio, title: e.target.value })} className="w-full bg-dark-bg border border-dark-border rounded-xl p-3 text-xs text-white" />
                  <input type="text" placeholder="التصنيف" value={editingPortfolio.category} onChange={e => setEditingPortfolio({ ...editingPortfolio, category: e.target.value })} className="w-full bg-dark-bg border border-dark-border rounded-xl p-3 text-xs text-white" />
                  
                  <div>
                    <label className="block text-[11px] font-bold text-gray-300 mb-1">صورة المشروع (رابط أو رفع)</label>
                    <input type="text" placeholder="رابط الصورة" value={editingPortfolio.image} onChange={e => setEditingPortfolio({ ...editingPortfolio, image: e.target.value })} className="w-full bg-dark-bg border border-dark-border rounded-xl p-3 text-xs text-white mb-2" />
                    <input type="file" accept="image/*" onChange={(e) => handleImageUpload(e.target.files[0], (base64) => setEditingPortfolio({ ...editingPortfolio, image: base64 }))} className="text-xs text-gray-400" />
                  </div>

                  <input type="text" placeholder="رابط مشروع Behance" value={editingPortfolio.behanceUrl} onChange={e => setEditingPortfolio({ ...editingPortfolio, behanceUrl: e.target.value })} className="w-full bg-dark-bg border border-dark-border rounded-xl p-3 text-xs text-white" />
                  <textarea placeholder="وصف المشروع" value={editingPortfolio.description} onChange={e => setEditingPortfolio({ ...editingPortfolio, description: e.target.value })} className="w-full bg-dark-bg border border-dark-border rounded-xl p-3 text-xs text-white" rows={3}></textarea>
                  
                  <div className="flex items-center space-x-2 space-x-reverse pt-2">
                    <button type="submit" className="flex-1 bg-brand text-white font-bold py-2.5 rounded-xl text-xs">حفظ المشروع</button>
                    <button type="button" onClick={() => setEditingPortfolio(null)} className="bg-gray-800 text-gray-300 py-2.5 px-4 rounded-xl text-xs">إلغاء</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* TESTIMONIAL EDIT MODAL */}
          {editingTestimonial && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 overflow-y-auto">
              <div className="bg-dark-card border border-dark-border rounded-3xl p-6 w-full max-w-md space-y-4 my-8">
                <h3 className="text-base font-extrabold text-white">إضافة / تعديل رأي عميل</h3>
                <form onSubmit={saveTestimonial} className="space-y-3">
                  <input type="text" placeholder="اسم العميل" required value={editingTestimonial.name} onChange={e => setEditingTestimonial({ ...editingTestimonial, name: e.target.value })} className="w-full bg-dark-bg border border-dark-border rounded-xl p-3 text-xs text-white" />
                  <input type="text" placeholder="الصفة / المسمى الوظيفي" value={editingTestimonial.role} onChange={e => setEditingTestimonial({ ...editingTestimonial, role: e.target.value })} className="w-full bg-dark-bg border border-dark-border rounded-xl p-3 text-xs text-white" />
                  
                  <div>
                    <label className="block text-[11px] font-bold text-gray-300 mb-1">صورة العميل (رابط أو رفع)</label>
                    <input type="text" placeholder="رابط الصورة الشخصية" value={editingTestimonial.avatar} onChange={e => setEditingTestimonial({ ...editingTestimonial, avatar: e.target.value })} className="w-full bg-dark-bg border border-dark-border rounded-xl p-3 text-xs text-white mb-2" />
                    <input type="file" accept="image/*" onChange={(e) => handleImageUpload(e.target.files[0], (base64) => setEditingTestimonial({ ...editingTestimonial, avatar: base64 }))} className="text-xs text-gray-400" />
                  </div>

                  <textarea placeholder="نص التقييم والرأي" required value={editingTestimonial.text} onChange={e => setEditingTestimonial({ ...editingTestimonial, text: e.target.value })} className="w-full bg-dark-bg border border-dark-border rounded-xl p-3 text-xs text-white" rows={3}></textarea>
                  
                  <div className="flex items-center space-x-2 space-x-reverse pt-2">
                    <button type="submit" className="flex-1 bg-brand text-white font-bold py-2.5 rounded-xl text-xs">حفظ التقييم</button>
                    <button type="button" onClick={() => setEditingTestimonial(null)} className="bg-gray-800 text-gray-300 py-2.5 px-4 rounded-xl text-xs">إلغاء</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    function OrderModal({ item, onClose, onSubmit }) {
      const [clientName, setClientName] = useState('');
      const [clientPhone, setClientPhone] = useState('');
      const [clientEmail, setClientEmail] = useState('');
      const [companyName, setCompanyName] = useState('');
      const [contactPreference, setContactPreference] = useState('واتساب');
      const [notes, setNotes] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        onSubmit({
          itemTitle: item.title,
          price: item.price,
          clientName,
          clientPhone,
          clientEmail,
          companyName,
          contactPreference,
          notes
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md p-4 overflow-y-auto">
          <div className="bg-dark-card border border-dark-border rounded-3xl p-6 sm:p-8 max-w-lg w-full space-y-6 my-8 relative shadow-2xl">
            <button 
              onClick={onClose}
              className="absolute top-5 left-5 text-gray-400 hover:text-white text-lg"
            >
              <i className="fa-solid fa-xmark"></i>
            </button>

            <div>
              <span className="bg-brand/10 text-brand border border-brand/20 text-[10px] font-bold px-3 py-1 rounded-full inline-block mb-2">
                طلب جديد
              </span>
              <h3 className="text-xl font-extrabold text-white">{item.title}</h3>
              <p className="text-xs text-brand font-bold mt-1">السعر: {item.price.toLocaleString()} جنيه مصري (ج.م)</p>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              
              {/* Full Name & Phone */}
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-bold text-gray-300 mb-1.5">الاسم بالكامل *</label>
                  <input 
                    type="text" 
                    required 
                    value={clientName} 
                    onChange={(e) => setClientName(e.target.value)} 
                    placeholder="مثال: أحمد محمود" 
                    className="w-full bg-dark-bg border border-dark-border rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-brand"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-300 mb-1.5">رقم التواصل (واتساب / تيليجرام) *</label>
                  <input 
                    type="tel" 
                    required 
                    value={clientPhone} 
                    onChange={(e) => setClientPhone(e.target.value)} 
                    placeholder="أدخل رقمك المفعل (مثال: 01001234567)" 
                    className="w-full bg-dark-bg border border-dark-border rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-brand"
                  />
                </div>
              </div>

              {/* Confirmation Notice */}
              <div className="bg-amber-500/10 border border-amber-500/30 rounded-xl p-3 flex items-start space-x-2 space-x-reverse text-[11px] text-amber-300">
                <i className="fa-solid fa-triangle-exclamation text-amber-400 mt-0.5 text-xs"></i>
                <span>يرجى التأكد تمامًا أن الرقم شغال وعليه حساب فعلي على (واتساب أو تيليجرام) لنسهل التواصل معك وإرسال التفاصيل.</span>
              </div>

              {/* Email & Company */}
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-bold text-gray-300 mb-1.5">البريد الإلكتروني</label>
                  <input 
                    type="email" 
                    value={clientEmail} 
                    onChange={(e) => setClientEmail(e.target.value)} 
                    placeholder="name@company.com" 
                    className="w-full bg-dark-bg border border-dark-border rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-brand"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-300 mb-1.5">اسم الشركة / المشروع</label>
                  <input 
                    type="text" 
                    value={companyName} 
                    onChange={(e) => setCompanyName(e.target.value)} 
                    placeholder="مثال: أفق للحلول الذكية" 
                    className="w-full bg-dark-bg border border-dark-border rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-brand"
                  />
                </div>
              </div>

              {/* Preferred Contact Method */}
              <div>
                <label className="block text-xs font-bold text-gray-300 mb-1.5">وسيلة التواصل المفضلة</label>
                <div className="grid grid-cols-3 gap-2">
                  {["واتساب", "تيليجرام", "بريد إلكتروني"].map((method) => (
                    <button
                      key={method}
                      type="button"
                      onClick={() => setContactPreference(method)}
                      className={`py-2.5 rounded-xl border text-xs font-bold transition-all ${
                        contactPreference === method 
                          ? "bg-brand text-white border-brand shadow-glow-brand" 
                          : "bg-dark-bg border-dark-border text-gray-400 hover:text-white"
                      }`}
                    >
                      {method}
                    </button>
                  ))}
                </div>
              </div>

              {/* Project Brief / Notes */}
              <div>
                <label className="block text-xs font-bold text-gray-300 mb-1.5">تفاصيل وملاحظات المشروع</label>
                <textarea 
                  rows={3}
                  value={notes} 
                  onChange={(e) => setNotes(e.target.value)} 
                  placeholder="اكتب نبذة مختصرة عن الألوان المفضلة، الموعد المطلوب، أو أي تفاصيل خاصة..." 
                  className="w-full bg-dark-bg border border-dark-border rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-brand"
                ></textarea>
              </div>

              <button 
                type="submit" 
                className="w-full bg-brand hover:bg-brand-dark text-white font-extrabold py-3.5 rounded-xl text-xs transition-all shadow-glow-brand flex items-center justify-center space-x-2 space-x-reverse"
              >
                <i className="fa-solid fa-paper-plane"></i>
                <span>تأكيد وإرسال طلب الخدمة</span>
              </button>

            </form>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
