<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta name="description" content="PREMIRALAB — استوديو تصميم الهوية والتجارب الرقمية. نحوّل أفكارك إلى تجارب بصرية قوية."/>
  <meta name="theme-color" content="#cd45cd"/>

  <!-- Preconnect for Web Fonts Optimization -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

  <!-- Favicon & App Icons -->
  <link rel="icon" type="image/png" href="/logo.png"/>
  <link rel="apple-touch-icon" href="/logo.png"/>

  <!-- Open Graph / Facebook / WhatsApp / Telegram Preview -->
  <meta property="og:type" content="website"/>
  <meta property="og:url" content="https://premiralab.up.railway.app/"/>
  <meta property="og:site_name" content="PREMIRALAB"/>
  <meta property="og:title" content="PREMIRALAB — استوديو تصميم الهوية والتجارب الرقمية"/>
  <meta property="og:description" content="نحوّل أفكارك إلى تجارب بصرية قوية — هوية بصرية، سوشيال ميديا، واجهات رقمية."/>
  <meta property="og:image" content="https://premiralab.up.railway.app/logo.png"/>
  <meta property="og:image:alt" content="PREMIRALAB Logo"/>
  <meta property="og:image:width" content="1200"/>
  <meta property="og:image:height" content="630"/>

  <!-- Twitter / X Preview -->
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:url" content="https://premiralab.up.railway.app/"/>
  <meta name="twitter:title" content="PREMIRALAB — استوديو تصميم الهوية والتجارب الرقمية"/>
  <meta name="twitter:description" content="نحوّل أفكارك إلى تجارب بصرية قوية — هوية بصرية، سوشيال ميديا، واجهات رقمية."/>
  <meta name="twitter:image" content="https://premiralab.up.railway.app/logo.png"/>

  <title>PREMIRALAB — استوديو تصميم الهوية والتجارب الرقمية</title>
  <!-- Prevent flash of unstyled theme -->
  <script>
    (function() {
      var t = localStorage.getItem('theme');
      if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
