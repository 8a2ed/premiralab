<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta name="description" content="منصة تصميم احترافية — هوية بصرية، سوشيال ميديا، واجهات رقمية."/>
  <meta name="theme-color" content="#cd45cd"/>
  <meta property="og:title" content="Design Studio"/>
  <meta property="og:description" content="نحوّل الأفكار إلى تجارب بصرية قوية."/>
  <title>Design Studio</title>
  <!-- Prevent flash of unstyled theme -->
  <script>
    (function() {
      var t = localStorage.getItem('theme');
      if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
