<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0"/>
  
  <!-- Web Fonts (Preconnect & Load Cairo & Tajawal) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">

  <!-- Primary Meta Tags -->
  <title>PREMIRALAB | منصة تصميم رقمية احترافية</title>
  <meta name="title" content="PREMIRALAB | منصة تصميم رقمية احترافية"/>
  <meta name="description" content="منصة تصميم احترافية — هوية بصرية، سوشيال ميديا، تطوير وتصميم واجهات رقمية متكاملة."/>
  <meta name="keywords" content="تصميم, جرافيك, هوية بصرية, تطوير مواقع, واجهات مستخدم, تصميم تطبيقات, براندنج, سوشيال ميديا, PREMIRALAB, Premira Lab"/>
  <meta name="theme-color" content="#cd45cd"/>
  <meta name="author" content="PREMIRALAB"/>

  <!-- Tab Info & Icons -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website"/>
  <meta property="og:url" content="https://premiralab.up.railway.app/"/>
  <meta property="og:title" content="PREMIRALAB | منصة تصميم رقمية احترافية"/>
  <meta property="og:description" content="نحوّل الأفكار إلى تجارب بصرية قوية ومشاريع رقمية رائدة."/>
  <meta property="og:image" content="/og-image.png"/>

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image"/>
  <meta property="twitter:url" content="https://premiralab.up.railway.app/"/>
  <meta property="twitter:title" content="PREMIRALAB | منصة تصميم رقمية احترافية"/>
  <meta property="twitter:description" content="نحوّل الأفكار إلى تجارب بصرية قوية ومشاريع رقمية رائدة."/>
  <meta property="twitter:image" content="/og-image.png"/>

  <!-- Prevent flash of unstyled theme -->
  <script>
    (function() {
      var t = localStorage.getItem('theme');
      if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
